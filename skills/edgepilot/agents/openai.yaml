interface:
  display_name: "EdgePilot"
  short_description: "Backtest and run trading strategies"
  default_prompt: "Use $edgepilot in my language and respond directly to my request. Before onboarding, call verify_activation; continue in the same reply when ready and require a Codex restart only when it reports restart_required. If I also ask to open the Dashboard, call open_dashboard once after activation is ready and before the first preference question. For a formal recommendation, guide me through the existing V2 preferences one question at a time and call recommend_strategies so ChatGPT can render the three cards, then call open_dashboard again after the cards and use that call's verified URL. Mention Dashboard lifecycle or background operation only when I ask about it."

interface:
  display_name: "EdgePilot"
  short_description: "Backtest and run trading strategies"
  default_prompt: "Use $edgepilot in my language and respond directly to my request. Before onboarding, call verify_activation; continue in the same reply when ready and require a Codex restart only when it reports restart_required. For a formal recommendation, guide me through the existing V2 preferences one question at a time and call recommend_strategies so ChatGPT can render the three cards. If I also ask to open the Dashboard, show open_control_center after the cards so I can press its Open Dashboard button. Mention Dashboard lifecycle or background operation only when I ask about it."

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "edgepilot"
version = "0.1.4"
description = "Agent-facing CLI for backtesting and running trading strategies"
requires-python = ">=3.12,<3.13"
dependencies = [
  "nautilus_trader==1.228.0",
  "matplotlib==3.10.8",
  "tqdm>=4.67.3,<5",
  "keyring>=25.6,<26",
  "filelock>=3.18,<4",
]

[project.scripts]
edgepilot = "edgepilot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/edgepilot"]

[tool.hatch.build.targets.wheel.force-include]
"backtest_core_src/edgepilot_backtest_core" = "edgepilot_backtest_core"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "edgepilot"
dynamic = ["version"]
description = "Agent-facing CLI for backtesting and running trading strategies"
requires-python = ">=3.12,<3.15"
dependencies = [
  "nautilus_trader==1.228.0",
  "matplotlib==3.10.8",
  "tqdm>=4.67.3,<5",
  "keyring>=25.6,<26",
]

[project.scripts]
edgepilot = "edgepilot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/edgepilot"]

[tool.hatch.version]
path = "src/edgepilot/VERSION"
pattern = "^(?P<version>(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*))$"

[tool.hatch.build.targets.wheel.force-include]
"core_src/edgepilot_core" = "edgepilot_core"
